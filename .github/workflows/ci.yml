name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bats:
    name: bats test suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install bats dependencies
        run: bash plugin/claude-code/tests/install-deps.sh

      - name: Run tests
        run: bash plugin/claude-code/tests/run_bats.sh --formatter tap
